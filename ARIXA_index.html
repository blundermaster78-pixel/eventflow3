<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EventFlow</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060c;--p:#0b1121;--p2:#111a30;--b:rgba(255,255,255,.1);--g:#f5c518;--t:#e2e8f0;--m:#8b97ad;--red:#f87171;--grn:#34d399;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#04060c;background-image:radial-gradient(800px 400px at 85% -10%,rgba(245,197,24,.09),transparent);color:var(--t);font:14px 'Plus Jakarta Sans',system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
h1,h2,h3,h4,p{margin:0}
.app{display:flex;height:100%}
aside{width:210px;background:#070b15;border-right:1px solid var(--b);display:flex;flex-direction:column;flex-shrink:0}
.logo{height:60px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--b);font-weight:800;font-size:18px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--g);display:grid;place-items:center;font-style:normal;color:#04060c;box-shadow:0 0 0 1px rgba(245,197,24,.4),0 8px 24px -8px rgba(245,197,24,.5)}
nav{padding:10px;display:flex;flex-direction:column;gap:4px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 12px;border-radius:12px;color:var(--m);font-weight:600;position:relative}
nav button:hover{background:rgba(255,255,255,.05);color:#fff}
nav button.on{background:rgba(245,197,24,.1);color:var(--g)}
nav button.on:before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--g)}
nav .n{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--b);background:rgba(7,11,21,.7)}
.top h1{font-size:18px;font-weight:700}.top small{color:var(--m);display:block;font-size:12px}
.top .sp{margin-left:auto}
.page{flex:1;overflow-y:auto;padding:24px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:9px 16px;font-weight:700;border:1px solid var(--b);background:rgba(255,255,255,.05)}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.gold{background:var(--g);color:#04060c;border-color:var(--g);box-shadow:0 0 0 1px rgba(245,197,24,.4),0 8px 24px -8px rgba(245,197,24,.5)}
.btn.gold:hover{background:#ffd43b}.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:rgba(11,17,33,.85);border:1px solid var(--b);border-radius:16px;padding:20px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{display:flex;gap:14px;align-items:center;cursor:pointer}.stat:hover{border-color:rgba(245,197,24,.35)}
.stat .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.2)}
.stat b{font-size:28px;font-weight:800;display:block;line-height:1.1}.stat small{color:var(--m)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
@media(max-width:800px){aside{width:64px}aside span,.logo b,nav .n{display:none}.page{padding:14px}}
h2{font-size:16px;font-weight:700}.mu{color:var(--m);font-size:12px}
.heat{display:grid;grid-template-columns:120px repeat(14,minmax(0,1fr));gap:5px;min-width:700px;margin-top:14px}
.hd{text-align:center;font-size:10px;color:var(--m);line-height:1.3}.hd b{display:block;font-size:12px;color:#cbd5e1}.hd.td,.hd.td b{color:var(--g)}
.cell{height:36px;border-radius:7px;border:1px solid}
.f0{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.2)}.f1{background:rgba(245,197,24,.2);border-color:rgba(245,197,24,.25)}
.f2{background:rgba(245,197,24,.4);border-color:rgba(245,197,24,.4)}.f3{background:rgba(245,197,24,.65);border-color:rgba(245,197,24,.6)}.f4{background:var(--g);border-color:var(--g)}
.cell:hover{filter:brightness(1.3)}.cell.cf{border:2px solid var(--red)}
.rl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.tag{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--b);background:rgba(255,255,255,.05);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:500;color:#cbd5e1;margin:0 4px 4px 0}
.tag.bad{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.1);color:#fca5a5}.tag.ok{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.1);color:#6ee7b7}
.bd{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;border:1px solid}
.bd.c,.bd.resolved{color:#6ee7b7;background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3)}
.bd.p{color:#ffe066;background:rgba(245,197,24,.1);border-color:rgba(245,197,24,.3)}
.bd.x,.bd.open{color:#fca5a5;background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}
.item{border:1px solid var(--b);background:rgba(255,255,255,.03);border-radius:12px;padding:12px;margin-bottom:10px}
.item b{display:block}.item small{color:var(--m)}
.li{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
table{width:100%;border-collapse:collapse;min-width:760px}th{text-align:left;color:var(--m);font-size:12px;padding:12px 16px;border-bottom:1px solid var(--b)}
td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}tr:hover td{background:rgba(255,255,255,.03)}
input,select{width:100%;background:#070b15;border:1px solid var(--b);border-radius:12px;padding:9px 12px;color:#f1f5f9;font:inherit;outline:none}
input:focus,select:focus{border-color:rgba(245,197,24,.6);box-shadow:0 0 0 3px rgba(245,197,24,.15)}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d9a800,#ffe066);border-radius:99px}.bar.r i{background:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{min-height:120px;border:1px solid var(--b);border-radius:12px;padding:8px;background:rgba(255,255,255,.02)}
.day h4{font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}.day h4.td{color:var(--g)}
.chip{font-size:10.5px;font-weight:600;border-radius:6px;padding:3px 6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid rgba(245,197,24,.3);background:rgba(245,197,24,.15);color:#ffe066}
.chip.p{border-style:dashed;background:rgba(245,197,24,.05)}.chip.x{border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.15);color:#fecaca}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.flt{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.flt input{max-width:300px}.flt select{width:auto}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mb{background:var(--p);border:1px solid var(--b);border-radius:18px;width:100%;max-width:980px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;border-bottom:1px solid var(--b)}
.mg{display:grid;grid-template-columns:3fr 2fr;flex:1;min-height:0}
@media(max-width:820px){.mg{grid-template-columns:1fr;overflow-y:auto}}
#mf,#mp{padding:22px;overflow-y:auto}#mp{background:rgba(7,11,21,.6);border-left:1px solid var(--b)}
.mf2{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--b)}
.st{display:flex;gap:10px;align-items:center;font-weight:700;margin:0 0 12px}.st b{width:24px;height:24px;border-radius:50%;background:rgba(245,197,24,.15);color:var(--g);display:grid;place-items:center;font-size:12px}
#mf .st:not(:first-child){margin-top:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip2{border:1px solid var(--b);background:rgba(255,255,255,.03);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:600;color:#cbd5e1}.chip2.on{border-color:var(--g);background:rgba(245,197,24,.1);color:var(--g)}
.row,.row3{display:grid;gap:12px;grid-template-columns:1fr 1fr}.row3{grid-template-columns:1.4fr 1fr 1fr}
label{display:block;font-size:12px;font-weight:600;color:var(--m)}label input,label select{margin-top:6px;color:#f1f5f9;font-weight:400}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rc{text-align:left;border:1px solid var(--b);background:rgba(255,255,255,.03);border-radius:12px;padding:12px;position:relative}
.rc:hover{border-color:rgba(255,255,255,.25)}.rc .e{font-size:20px}.rc b{display:block;margin-top:6px}.rc small{color:var(--m);font-size:11px}
.rc.on{border-color:var(--g);background:rgba(245,197,24,.1)}.rc.bad{border-color:rgba(248,113,113,.6);background:rgba(248,113,113,.1)}.rc.free{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.1)}
.rc .ck{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;background:var(--g);color:#04060c;font-size:11px;font-weight:800;display:grid;place-items:center}.rc.bad .ck{background:var(--red)}.rc.free .ck{background:var(--grn)}
.idle{border:1px dashed rgba(255,255,255,.15);border-radius:14px;padding:26px;text-align:center;font-size:30px}.idle b{display:block;font-size:14px;margin-top:8px}.idle p{font-size:12px;color:var(--m);margin-top:4px}
.box{border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid}.box p{font-size:13px;margin-top:4px;opacity:.85}
.box.g{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:#6ee7b7}.box.r{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:#fca5a5}
.sum{border:1px solid var(--b);background:rgba(255,255,255,.03);border-radius:12px;padding:14px}.sum p{margin:6px 0;color:#cbd5e1}.sum div{margin-top:10px}
.rr{border:1px solid var(--b);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.03)}.rr.bad{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06)}
.rr>div:first-child{display:flex;justify-content:space-between;gap:8px}.rt{color:#fca5a5;font-size:12px;font-weight:700}.gt{color:#6ee7b7;font-size:12px;font-weight:700}
.ex{background:rgba(0,0,0,.3);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px;color:var(--m)}.ex b{color:#e2e8f0}
#mp h4{margin:16px 0 8px;font-size:14px}
.alt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid rgba(245,197,24,.25);background:rgba(245,197,24,.06);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.alt:hover{border-color:var(--g);background:rgba(245,197,24,.12)}.alt small{color:var(--m)}.alt em{font-style:normal;color:var(--g);font-weight:700;font-size:12px;white-space:nowrap}
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:10px;width:340px;max-width:calc(100vw - 36px)}
.toast{background:#111a30;border:1px solid;border-radius:12px;padding:13px 15px;box-shadow:0 20px 50px -20px #000;animation:sl .25s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(24px)}}
.toast.ok{border-color:rgba(52,211,153,.4)}.toast.err{border-color:rgba(248,113,113,.4)}.toast.info{border-color:rgba(245,197,24,.4)}
.toast b{display:block}.toast small{color:var(--m)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--m)}.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;margin-top:20px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:10px;color:var(--m)}.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:rgba(245,197,24,.4)}.bars i.pk{background:var(--g)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const D=n=>addD(iso(new Date()),n);
const fd=s=>pd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const wd=s=>pd(s).toLocaleDateString('en-GB',{weekday:'short'});
const tm=t=>{const[a,b]=t.split(':').map(Number);return a*60+b},ft=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const R=[{id:'stage',n:'Main Stage',s:'Stage',i:'🎭',sp:'12 × 8 m',d:'Modular performance stage with backstage wing.'},
{id:'generator',n:'Generator 50KVA',s:'Generator',i:'⚡',sp:'50 KVA · 3-phase',d:'Silent diesel generator for outdoor and backup power.'},
{id:'sound',n:'Sound System',s:'Sound',i:'🔊',sp:'8 kW · 16 ch',d:'Line-array PA with mixer and wireless mics.'},
{id:'led',n:'LED Display',s:'LED',i:'📺',sp:'6 × 3 m · P3.9',d:'Outdoor LED video wall for live feeds.'},
{id:'projector',n:'Projector',s:'Projector',i:'📽️',sp:'12,000 lm · 4K',d:'Laser projector with tripod screen.'},
{id:'chairs',n:'Folding Chairs',s:'Chairs',i:'🪑',sp:'500 units',d:'Stackable chairs in lots of 50.'}];
const API_BASE='https://arixa-reservation-backend--nyatiharshil.replit.app';
let backendResources=[];
async function loadBackendResources(){
 try{
  const r=await fetch(API_BASE+'/api/resources');
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(!j.success||!Array.isArray(j.data))throw new Error('Invalid resources response');
  backendResources=j.data;
  const byCategory={};
  backendResources.forEach(x=>{byCategory[x.category]=(byCategory[x.category]||[]).concat(x)});
  R.forEach(x=>{
   const candidates={
    stage:byCategory.Stage||[],
    generator:byCategory.Power||[],
    sound:byCategory.Audio||[],
    led:byCategory.Display||[],
    projector:(byCategory.Display||[]).filter(v=>/projector/i.test(v.name)),
    chairs:[]
   }[x.id]||[];
   const b=candidates[0];
   if(b){
    x.backendId=b.id;
    x.n=b.name;
    x.d=b.description||x.d;
    x.s=b.category||x.s;
    x.sp=b.quantity!=null?`${b.quantity} unit${b.quantity===1?'':'s'}${b.location?' · '+b.location:''}`:x.sp;
   }
  });
  render();
  toast('ok','Backend connected',`${backendResources.length} resources loaded from ARIXA.`);
 }catch(e){
  console.warn('ARIXA resource API unavailable:',e);
 }
}

const rn=id=>R.find(r=>r.id===id);
const tag=(id,bad)=>`<span class="tag ${bad?'bad':''}">${rn(id).i} ${rn(id).s}</span>`;
const mk=(id,ev,org,o,s,e,rs,st)=>({id,ev,org,date:D(o),s,e,rs,st});
let res=[mk('r1','Freshers Welcome Concert','Student Council',1,'17:00','22:00',['stage','generator','sound','led'],'c'),
mk('r2','Tech Symposium Keynote','CS Department',2,'09:00','13:00',['stage','projector','sound','chairs'],'c'),
mk('r3','Robotics Expo','Robotics Club',3,'10:00','16:00',['led','projector','chairs'],'c'),
mk('r4','Photography Workshop','Arts Society',3,'13:00','15:00',['projector','chairs'],'p'),
mk('r5','Alumni Gala Night','Alumni Office',4,'18:00','23:00',['stage','sound','led','chairs','generator'],'c'),
mk('r6','Open Mic Night','Drama Society',4,'20:00','22:00',['sound','generator'],'p'),
mk('r7','Career Fair','Placement Cell',6,'09:00','17:00',['chairs','projector','led'],'c'),
mk('r8','Cultural Fest Rehearsal','Cultural Committee',7,'14:00','18:00',['stage','sound'],'c'),
mk('r9','Department Awards Ceremony','Dean’s Office',7,'16:00','19:00',['stage','projector'],'p'),
mk('r10','Hackathon Opening','Developer Club',9,'10:00','12:00',['projector','led','chairs'],'c'),
mk('r11','Sports Day Closing','Sports Committee',10,'15:00','20:00',['generator','sound','chairs'],'c'),
mk('r12','Open-Air Film Screening','Film Club',11,'19:00','22:00',['projector','sound','led'],'c'),
mk('r13','Convocation Rehearsal','Registrar Office',12,'09:00','15:00',['stage','chairs','sound','generator'],'c'),
mk('r14','Farewell Party','Class of 2026',13,'18:00','23:00',['stage','sound','generator','led'],'c')];
const TP=[{id:'concert',l:'Concert / Cultural Night',n:'Cultural Night',h:3,r:['stage','generator','sound']},
{id:'conf',l:'Conference / Keynote',n:'Tech Conference',h:4,r:['stage','projector','sound','chairs']},
{id:'expo',l:'Expo / Fair',n:'Innovation Expo',h:5,r:['led','projector','chairs']}];
/* ---- engine ---- */
function hits(q,ign){const a=tm(q.s),b=tm(q.e),o=[];
 res.forEach(x=>{if(x.id===ign||x.date!==q.date||!(a<tm(x.e)&&tm(x.s)<b))return;q.sel.forEach(id=>{if(x.rs.includes(id))o.push({rid:id,b:x})})});return o}
function alts(q,ign){const dur=tm(q.e)-tm(q.s),rs=tm(q.s),lo=D(0),hi=D(13),c=[];
 for(let o=-3;o<=7;o++){const d=addD(q.date,o);if(d<lo||d>hi)continue;
  for(let s=480;s+dur<=1380;s+=30){if(!o&&s===rs)continue;
   if(!hits({date:d,s:ft(s),e:ft(s+dur),sel:q.sel},ign).length)c.push({d,s,o,sc:Math.abs(o)*1000+(o<0?10:0)+Math.abs(s-rs)})}}
 c.sort((a,b)=>a.sc-b.sc);const p=[];
 for(const x of c)if(p.length<3&&!p.some(y=>y.d===x.d))p.push(x);
 for(const x of c)if(p.length<3&&!p.includes(x)&&p.every(y=>y.d!==x.d||Math.abs(y.s-x.s)>=120))p.push(x);
 return p.sort((a,b)=>a.sc-b.sc).map(x=>({date:x.d,s:ft(x.s),e:ft(x.s+dur),note:x.o===0?(x.s<rs?'Same day, earlier':'Same day, later'):x.o===1?'Next day':x.o===-1?'Previous day':x.o>0?x.o+' days later':(-x.o)+' days earlier'}))}
function seed(){const o=[];let n=0;
 for(let i=0;i<res.length;i++)for(let j=i+1;j<res.length;j++){const a=res[i],b=res[j];
  if(a.date!==b.date||!(tm(a.s)<tm(b.e)&&tm(b.s)<tm(a.e)))continue;
  const sh=a.rs.filter(x=>b.rs.includes(x));if(!sh.length)continue;n++;
  const[ex,inc]=a.st==='p'&&b.st!=='p'?[b,a]:[a,b];
  sh.forEach(rid=>o.push({id:`s-${ex.id}-${inc.id}-${rid}`,rid,date:a.date,s:ft(Math.max(tm(a.s),tm(b.s))),e:ft(Math.min(tm(a.e),tm(b.e))),exId:ex.id,exName:ex.ev,inId:inc.id,inName:inc.ev,inS:inc.s,inE:inc.e,inRs:inc.rs,org:inc.org,kind:'o',st:'open',t:Date.now()-n*47*6e4}))}
 return o}
let C=seed(),S={page:'dash',q:'',fs:'all',fr:'all',m:null};
const mins=(rid,d)=>{let t=0;res.forEach(x=>{if(x.date===d&&x.rs.includes(rid)){const s=Math.max(480,tm(x.s)),e=Math.min(1380,tm(x.e));if(e>s)t+=e-s}});return t};
const days=Array.from({length:14},(_,i)=>D(i));
const util=rid=>Math.round(days.reduce((s,d)=>s+mins(rid,d),0)/(14*900)*100);
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-t)/6e4));return m<60?m+'m ago':Math.round(m/60)+'h ago'};
const openC=()=>C.filter(c=>c.st==='open'),badIds=()=>new Set(openC().filter(c=>c.inId).map(c=>c.inId));
const bd=k=>`<span class="bd ${k}">${{c:'Confirmed',p:'Pending',x:'Conflict',open:'Open',resolved:'Resolved'}[k]}</span>`;
function toast(t,a,b){const e=document.createElement('div');e.className='toast '+t;e.innerHTML=`<b>${a}</b>${b?`<small>${b}</small>`:''}`;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),4500)}
/* ---- pages ---- */
const P=[['dash','📊','Dashboard','Resource availability for the next two weeks'],['cal','🗓️','Calendar','Every reservation, day by day'],['res','📦','Resources','Event-staging equipment inventory'],['rsv','📋','Reservations','Search, filter and manage bookings'],['conf','⚠️','Conflicts','Double-booking attempts caught by EventFlow'],['ana','📈','Analytics','How resources are being used']];
const go=p=>{S.page=p;render()};
function render(){const cur=P.find(p=>p[0]===S.page),n=openC().length;
$('#app').innerHTML=`<aside><div class="logo"><i>◆</i><b>EventFlow</b></div><nav>${P.map(p=>`<button class="${S.page===p[0]?'on':''}" onclick="go('${p[0]}')">${p[1]} <span>${p[2]}</span>${p[0]==='conf'&&n?`<em class="n">${n}</em>`:''}</button>`).join('')}</nav></aside>
<div class="main"><div class="top"><div><h1>${cur[2]}</h1><small>${cur[3]}</small></div><button class="btn sp" onclick="go('conf')" title="Open conflicts">🔔 ${n}</button><button class="btn gold" onclick="openM()">＋ New Reservation</button></div><div class="page">${pages[S.page]()}</div></div>`}
const pages={
dash(){const o=openC(),pend=res.filter(r=>r.st==='p').length,u=Math.round(R.reduce((s,r)=>s+util(r.id),0)/R.length),cf=new Set(o.map(c=>c.rid+'|'+c.date));
const rec=[...C].sort((a,b)=>b.t-a.t).slice(0,4),up=[...res].sort((a,b)=>(a.date+a.s).localeCompare(b.date+b.s)).slice(0,5);
return`<div class="grid4">
<div class="card stat" onclick="go('res')"><div class="ic">📦</div><div><small>Total resources</small><b>${R.length}</b><small>Stage, power, audio, visual, seating</small></div></div>
<div class="card stat" onclick="go('rsv')"><div class="ic">✅</div><div><small>Active reservations</small><b>${res.length}</b><small>${pend} awaiting approval</small></div></div>
<div class="card stat" onclick="go('conf')"><div class="ic">⚠️</div><div><small>Open conflicts</small><b>${o.length}</b><small>${o.length?'Needs rescheduling':'All clear'}</small></div></div>
<div class="card stat" onclick="go('ana')"><div class="ic">⚡</div><div><small>Resource utilization</small><b>${u}%</b><small>Next 14 days, 08:00–23:00</small></div></div></div>
<div class="two"><div class="card" style="overflow-x:auto"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px"><div><h2>Two-week availability</h2><p class="mu">Click any cell to reserve that resource on that day.</p></div>
<div class="legend"><span><i class="f0"></i>Free</span><span><i class="f2"></i>Partly booked</span><span><i class="f4"></i>Heavily booked</span><span><i style="border:2px solid var(--red)"></i>Open conflict</span></div></div>
<div class="heat"><div></div>${days.map(d=>`<div class="hd ${d===D(0)?'td':''}">${wd(d)}<b>${pd(d).getDate()}</b></div>`).join('')}
${R.map(r=>`<div class="rl">${r.i} <span>${r.n}</span></div>`+days.map(d=>{const m=mins(r.id,d),k=m===0?0:m<270?1:m<495?2:m<720?3:4;return`<button class="cell f${k} ${cf.has(r.id+'|'+d)?'cf':''}" title="${r.n} · ${fd(d)} · ${(m/60).toFixed(1)}h booked" onclick="openM({date:'${d}',sel:['${r.id}']})"></button>`}).join('')).join('')}</div></div>
<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><h2>Recent conflicts</h2><button style="color:var(--g);font-weight:700;font-size:12px" onclick="go('conf')">View all →</button></div>
${rec.length?rec.map(c=>`<div class="item"><div style="display:flex;justify-content:space-between">${tag(c.rid,c.st==='open')}${bd(c.st)}</div><b style="margin-top:8px">${esc(c.inName)}</b><small>clashes with ${esc(c.exName)} · ${fd(c.date)}, ${c.s}–${c.e}</small><br><small>${ago(c.t)}</small></div>`).join(''):'<p class="mu">No conflicts. Every booking is clean.</p>'}</div></div>
<div class="card"><h2 style="margin-bottom:6px">Next up</h2>${up.map(r=>`<div class="li"><div style="width:110px"><b>${fd(r.date)}</b><small class="mu">${r.s}–${r.e}</small></div><div style="flex:1;min-width:160px"><b>${esc(r.ev)}</b><small class="mu">${esc(r.org)}</small></div><div>${r.rs.map(x=>tag(x)).join('')}</div>${bd(r.st)}</div>`).join('')}</div>`},
cal(){const bad=badIds();return`<div class="card"><div class="legend" style="margin-bottom:14px"><span><i style="background:rgba(245,197,24,.5)"></i>Confirmed</span><span><i style="border:1px dashed var(--g)"></i>Pending</span><span><i style="background:var(--red)"></i>Conflict</span></div><div class="cal">${days.map(d=>{const it=res.filter(r=>r.date===d).sort((a,b)=>a.s.localeCompare(b.s));
return`<div class="day"><h4 class="${d===D(0)?'td':''}"><span>${pd(d).getDate()} ${pd(d).toLocaleDateString('en-GB',{month:'short'})}</span><span class="mu">${d===D(0)?'Today':wd(d)}</span></h4>${it.map(r=>`<div class="chip ${bad.has(r.id)?'x':r.st==='p'?'p':''}" title="${esc(r.ev)} ${r.s}–${r.e}">${r.s} ${esc(r.ev)}</div>`).join('')}</div>`}).join('')}</div></div>`},
res(){return`<div class="cg">${R.map(r=>{const u=util(r.id),mine=res.filter(x=>x.rs.includes(r.id)),nx=[...mine].sort((a,b)=>(a.date+a.s).localeCompare(b.date+b.s))[0];
return`<div class="card"><div style="display:flex;justify-content:space-between"><div class="ic" style="font-size:26px">${r.i}</div><span class="bd c">Available</span></div><h3 style="margin-top:12px;font-size:17px">${r.n}</h3><p class="mu">${r.sp}</p><p style="margin-top:8px;color:var(--m)">${r.d}</p>
<div style="margin-top:14px;display:flex;justify-content:space-between;font-size:12px"><span class="mu">Utilization, next 14 days</span><b>${u}%</b></div><div class="bar"><i style="width:${u}%"></i></div>
<div class="item" style="margin:14px 0"><small>${mine.length} bookings this fortnight</small><b style="font-size:12px">${nx?`Next: ${esc(nx.ev)}, ${fd(nx.date)} ${nx.s}`:'No upcoming bookings'}</b></div>
<button class="btn" style="width:100%;justify-content:center" onclick="openM({sel:['${r.id}']})">📅 Reserve ${r.s}</button></div>`}).join('')}</div>`},
rsv(){return`<div class="flt"><input placeholder="Search events or organizers" value="${esc(S.q)}" oninput="S.q=this.value;$('#rows').innerHTML=rows()"><select onchange="S.fs=this.value;$('#rows').innerHTML=rows()"><option value="all">All statuses</option><option value="c" ${S.fs==='c'?'selected':''}>Confirmed</option><option value="p" ${S.fs==='p'?'selected':''}>Pending</option><option value="x" ${S.fs==='x'?'selected':''}>Has conflict</option></select>
<select onchange="S.fr=this.value;$('#rows').innerHTML=rows()"><option value="all">All resources</option>${R.map(r=>`<option value="${r.id}" ${S.fr===r.id?'selected':''}>${r.n}</option>`).join('')}</select></div>
<div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>Event</th><th>Date</th><th>Time</th><th>Resources</th><th>Status</th><th></th></tr></thead><tbody id="rows">${rows()}</tbody></table></div>`},
conf(){const l=[...C].sort((a,b)=>(a.st==='open'?0:1)-(b.st==='open'?0:1)||b.t-a.t);
return l.length?`<div class="cg" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${l.map(c=>`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span>${tag(c.rid,c.st==='open')} <span class="mu">${c.kind==='o'?'Double-booking in schedule':'Booking attempt blocked'} · ${ago(c.t)}</span></span>${bd(c.st)}</div>
<p style="margin:14px 0"><b>${rn(c.rid).n}</b> is wanted by two events on ${fd(c.date)}. Overlap: <b style="color:#fca5a5">${c.s}–${c.e}</b></p>
<div class="item"><small>Existing booking</small><b>${esc(c.exName)}</b></div><div class="item" style="border-color:rgba(248,113,113,.25);background:rgba(248,113,113,.06)"><small>${c.kind==='o'?'Pending request':'Blocked request'}</small><b>${esc(c.inName)}</b><small>${c.inS}–${c.inE} · ${c.inRs.length} resources</small></div>
${c.st==='open'?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn gold" onclick="resched('${c.id}')">💡 Find alternative slots</button><button class="btn" onclick="resolve('${c.id}')">✓ Mark resolved</button></div>`:`<p style="color:#6ee7b7;font-size:12px">✓ Resolved. No double-booking occurred.</p>`}</div>`).join('')}</div>`:'<div class="card" style="text-align:center;padding:50px"><h3>No conflicts</h3><p class="mu">Create a reservation that overlaps an existing one to see the engine catch it.</p></div>'},
ana(){const pr=R.map(r=>({r,u:util(r.id)})).sort((a,b)=>b.u-a.u),pdn=days.map(d=>({d,n:res.filter(r=>r.date===d).reduce((s,r)=>s+r.rs.length,0)})),mx=Math.max(1,...pdn.map(x=>x.n)),pk=pdn.reduce((a,b)=>b.n>a.n?b:a),cb=R.map(r=>({r,n:C.filter(c=>c.rid===r.id).length})),mc=Math.max(1,...cb.map(x=>x.n));
return`<div class="grid4"><div class="card stat"><div class="ic">⚡</div><div><small>Overall utilization</small><b>${Math.round(R.reduce((s,r)=>s+util(r.id),0)/R.length)}%</b></div></div><div class="card stat"><div class="ic">🏆</div><div><small>Busiest resource</small><b>${pr[0].r.s}</b><small>${pr[0].u}% utilized</small></div></div><div class="card stat"><div class="ic">📅</div><div><small>Peak day</small><b>${pd(pk.d).getDate()} ${pd(pk.d).toLocaleDateString('en-GB',{month:'short'})}</b><small>${pk.n} resource bookings</small></div></div><div class="card stat"><div class="ic">🛡️</div><div><small>Double-bookings prevented</small><b>${C.filter(c=>c.kind==='b').length}</b><small>Blocked at check time</small></div></div></div>
<div class="two" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Utilization by resource</h2>${pr.map(x=>`<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;font-weight:600">${x.r.i} ${x.r.n}<b>${x.u}%</b></div><div class="bar"><i style="width:${x.u}%"></i></div></div>`).join('')}</div>
<div class="card"><h2>Conflicts by resource</h2>${cb.map(x=>`<div style="margin-top:16px"><div style="display:flex;justify-content:space-between;font-weight:600">${x.r.n}<b>${x.n}</b></div><div class="bar r"><i style="width:${x.n/mc*100}%"></i></div></div>`).join('')}</div></div>
<div class="card"><h2>Daily demand</h2><p class="mu">Resource bookings per day</p><div class="bars">${pdn.map(x=>`<div title="${fd(x.d)}: ${x.n}">${x.n||''}<i class="${x.d===pk.d?'pk':''}" style="height:${x.n/mx*100}%;min-height:${x.n?6:2}px"></i>${pd(x.d).getDate()}</div>`).join('')}</div></div>`}};
function rows(){const bad=badIds(),q=S.q.toLowerCase();
const l=res.filter(r=>(r.ev+r.org).toLowerCase().includes(q)&&(S.fs==='all'||(S.fs==='x'?bad.has(r.id):r.st===S.fs))&&(S.fr==='all'||r.rs.includes(S.fr))).sort((a,b)=>(a.date+a.s).localeCompare(b.date+b.s));
return l.length?l.map(r=>`<tr><td><b>${esc(r.ev)}</b><br><small class="mu">${esc(r.org)}</small></td><td>${fd(r.date)}</td><td>${r.s}–${r.e}</td><td>${r.rs.map(x=>tag(x)).join('')}</td><td>${bd(bad.has(r.id)?'x':r.st)}</td><td><button title="Cancel reservation" onclick="cancel('${r.id}')">🗑️</button></td></tr>`).join(''):'<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--m)">No reservations match these filters.</td></tr>'}
function cancel(id){const r=res.find(x=>x.id===id);res=res.filter(x=>x.id!==id);C.forEach(c=>{if(c.st==='open'&&(c.inId===id||c.exId===id))c.st='resolved'});toast('info','Reservation cancelled',r?esc(r.ev)+' was removed and its resources are free again.':'');render()}
function resolve(id){C.find(c=>c.id===id).st='resolved';toast('ok','Conflict marked resolved');render()}
function resched(id){const c=C.find(x=>x.id===id);openM({name:c.inName,org:c.org,date:c.date,s:c.inS,e:c.inE,sel:[...c.inRs],rep:c.inId,auto:1})}
/* ---- booking modal ---- */
const opts=v=>{let o='';for(let m=480;m<=1380;m+=30)o+=`<option ${ft(m)===v?'selected':''}>${ft(m)}</option>`;return o};
function openM(p={}){S.m={name:p.name||'',org:p.org||'',date:p.date||D(1),s:p.s||'18:00',e:p.e||'21:00',sel:p.sel||[],result:null,tpl:null,rep:p.rep||null};
$('#modal').innerHTML=`<div class="ov" onmousedown="if(event.target===this)closeM()"><div class="mb"><div class="mh"><div><h2>${p.rep?'Reschedule reservation':'New reservation'}</h2><p class="mu">Pick resources and a time. EventFlow checks every resource before confirming.</p></div><div>${p.rep?'':'<button class="btn" onclick="demo()">✨ Try a conflict</button> '}<button class="btn" onclick="closeM()">✕</button></div></div><div class="mg"><div id="mf"></div><div id="mp"></div></div><div class="mf2" id="mfoot"></div></div></div>`;
renderForm();renderPanel();if(p.auto)check()}
function closeM(){S.m=null;$('#modal').innerHTML=''}
function inv(){S.m.result=null;renderPanel()}
function pick(id){const t=TP.find(x=>x.id===id),m=S.m;m.tpl=id;m.name=t.n;m.sel=[...t.r];m.e=ft(Math.min(1380,tm(m.s)+t.h*60));m.result=null;renderForm();renderPanel()}
function demo(){pick('concert');const m=S.m;m.name='Spring Music Fest';m.org='Music Society';m.date=D(4);m.s='19:00';m.e='22:00';renderForm();renderPanel()}
function tog(id){const m=S.m;m.sel=m.sel.includes(id)?m.sel.filter(x=>x!==id):[...m.sel,id];m.result=null;renderForm();renderPanel()}
function renderForm(){const m=S.m;if(!m||!$('#mf'))return;const by=new Set((m.result&&m.result.h||[]).map(x=>x.rid));
$('#mf').innerHTML=`<div class="st"><b>1</b>Select event</div><div class="chips">${TP.map(t=>`<button class="chip2 ${m.tpl===t.id?'on':''}" onclick="pick('${t.id}')">${t.l}</button>`).join('')}</div>
<div class="row"><label>Event name<input value="${esc(m.name)}" placeholder="e.g. Spring Music Fest" oninput="S.m.name=this.value;inv()"></label><label>Organizer<input value="${esc(m.org)}" placeholder="e.g. Music Society" oninput="S.m.org=this.value"></label></div>
<div class="st"><b>2</b>Date and time</div><div class="row3"><label>Date<input type="date" min="${D(0)}" max="${D(13)}" value="${m.date}" onchange="S.m.date=this.value;inv()"></label><label>Start<select onchange="S.m.s=this.value;inv()">${opts(m.s)}</select></label><label>End<select onchange="S.m.e=this.value;inv()">${opts(m.e)}</select></label></div>
${tm(m.e)<=tm(m.s)?'<p style="color:var(--red);font-size:12px;margin-top:8px">End time must be after the start time.</p>':''}
<div class="st"><b>3</b>Select resources</div><div class="rg">${R.map(r=>{const on=m.sel.includes(r.id),cl=m.result&&on?(by.has(r.id)?'bad':'free'):on?'on':'';return`<button class="rc ${cl}" onclick="tog('${r.id}')">${on?`<span class="ck">${cl==='bad'?'✕':'✓'}</span>`:''}<span class="e">${r.i}</span><b>${r.n}</b><small>${r.sp}</small></button>`}).join('')}</div>
<p class="mu" style="margin-top:8px">${m.sel.length} selected. All of them must be free for the reservation to go through.</p>`}
function renderPanel(){const m=S.m;if(!m||!$('#mp'))return;const r=m.result,ok=m.name.trim()&&m.sel.length&&tm(m.e)>tm(m.s);let h='<div class="st"><b>4</b>Availability</div>';
if(!r)h+=`<div class="idle">🛡️<b>Ready to check</b><p>${ok?`We'll test ${m.sel.length} resource${m.sel.length>1?'s':''} against every booking on ${fd(m.date)}.`:'Add an event name, a valid time and at least one resource.'}</p></div>`;
else if(r.ok)h+=`<div class="box g"><b>✓ ${r.applied?'Alternative slot applied':'No conflicts found'}</b><p>All ${m.sel.length} resources are free for the slot below.</p></div><div class="sum"><b>${esc(m.name)}</b><p>📅 ${fd(m.date)}</p><p>🕒 ${m.s} – ${m.e}</p><div>${m.sel.map(id=>`<span class="tag ok">✓ ${rn(id).n}</span>`).join('')}</div></div>`;
else{const by={};r.h.forEach(x=>(by[x.rid]=by[x.rid]||[]).push(x));
h+=`<div class="box r"><b>⚠ Conflict detected</b><p>${Object.keys(by).length} of ${m.sel.length} resources are already booked on ${fd(m.date)}, ${m.s}–${m.e}.</p></div>`+
m.sel.map(id=>{const x=by[id];return`<div class="rr ${x?'bad':''}"><div><b>${rn(id).i} ${rn(id).n}</b><span class="${x?'rt':'gt'}">${x?'Unavailable':'Free'}</span></div>${(x||[]).map(y=>`<div class="ex"><b>Already booked: ${esc(y.b.ev)}</b><br>${y.b.s}–${y.b.e} · ${esc(y.b.org)}${y.b.st==='p'?' · pending':''}</div>`).join('')}</div>`}).join('')+
`<h4>💡 Alternative slots</h4>`+(r.a.length?r.a.map((a,i)=>`<button class="alt" onclick="pickAlt(${i})"><span><b>${fd(a.date)} · ${a.s}–${a.e}</b><br><small>${a.note} · all ${m.sel.length} resources free</small></span><em>Use slot →</em></button>`).join(''):'<p class="mu">No slot in the next two weeks has all resources free. Try fewer resources.</p>')}
$('#mp').innerHTML=h;
$('#mfoot').innerHTML=`<button class="btn" onclick="closeM()">Cancel</button>`+(r&&r.ok?`<button class="btn gold" onclick="confirmM()">✓ Confirm reservation</button>`:`<button class="btn gold" ${ok?'':'disabled'} onclick="check()">🛡️ ${r?'Check again':'Check availability'}</button>`)}
function check(){const m=S.m,q={date:m.date,s:m.s,e:m.e,sel:m.sel},h=hits(q,m.rep);
 if(!h.length){m.result={ok:true};toast('ok','All resources available',`${m.sel.length} of ${m.sel.length} resources are free for this slot.`)}
 else{m.result={ok:false,h,a:alts(q,m.rep)};toast('err','Conflict detected',`${new Set(h.map(x=>x.rid)).size} of ${m.sel.length} resources are already booked.`);
  h.forEach(x=>{const id=`b-${m.name.trim()}-${m.date}-${m.s}-${x.rid}-${x.b.id}`;if(C.some(c=>c.id===id))return;
   C.unshift({id,rid:x.rid,date:m.date,s:ft(Math.max(tm(m.s),tm(x.b.s))),e:ft(Math.min(tm(m.e),tm(x.b.e))),exId:x.b.id,exName:x.b.ev,inId:m.rep||null,inName:m.name.trim(),inS:m.s,inE:m.e,inRs:[...m.sel],org:m.org,kind:'b',st:'open',t:Date.now()})})}
 renderForm();renderPanel();render()}
function pickAlt(i){const m=S.m,a=m.result.a[i];m.date=a.date;m.s=a.s;m.e=a.e;m.result={ok:true,applied:1};toast('info','Alternative slot selected',`${fd(a.date)}, ${a.s}–${a.e}. Ready to confirm.`);renderForm();renderPanel()}
function confirmM(){const m=S.m;if(hits({date:m.date,s:m.s,e:m.e,sel:m.sel},m.rep).length){check();return}
 const n={id:'r'+Date.now(),ev:m.name.trim(),org:m.org.trim()||'Student Affairs',date:m.date,s:m.s,e:m.e,rs:[...m.sel],st:'c'};
 res=[...res.filter(x=>x.id!==m.rep),n];
 C.forEach(c=>{if(c.st==='open'&&((m.rep&&c.inId===m.rep)||(c.kind==='b'&&c.inName===n.ev)))c.st='resolved'});
 closeM();toast('ok','Reservation confirmed',`${esc(n.ev)} · ${fd(n.date)}, ${n.s}–${n.e} · ${n.rs.length} resources reserved.`);render()}
render();
loadBackendResources();
</script>
</body>
